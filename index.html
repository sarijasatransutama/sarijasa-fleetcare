<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riwayat Perbaikan Trailer - PT Sarijasa</title>
<style>
:root{--bg:#eef0f2;--card:#fff;--ink:#1c2630;--mute:#5d6b78;--line:#d3d9de;--main:#14507a;--warn:#e6a100}
@media (prefers-color-scheme:dark){:root{--bg:#141a20;--card:#1d252d;--ink:#e8edf1;--mute:#9aa8b4;--line:#33404b;--main:#4aa3dd;--warn:#f0b429}}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--main);color:#fff;padding:18px 16px;border-bottom:6px solid var(--warn)}
header h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;font-size:.85rem;opacity:.9}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:1.05rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:.8rem;color:var(--mute);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:9px 14px;border:0;border-radius:4px;background:var(--main);color:#fff;font:inherit;cursor:pointer}
button.alt{background:transparent;color:var(--main);border:1px solid var(--main)}
button.del{background:transparent;color:#c0392b;border:1px solid #c0392b;padding:4px 8px;font-size:.8rem}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input{flex:1;min-width:180px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600}
.empty{color:var(--mute);padding:16px 0}
.total{font-weight:600;margin-top:10px}
:focus-visible{outline:3px solid var(--warn);outline-offset:1px}
</style>
</head>
<body>
<header>
<h1>Riwayat Perbaikan Trailer</h1>
<p>PT Sarijasa</p>
</header>
<main>
<section class="card">
<h2 id="judulForm">Catat perbaikan baru</h2>
<div class="grid">
<div><label for="tgl">Tanggal</label><input type="date" id="tgl"></div>
<div><label for="plat">Nomor polisi</label><input id="plat" placeholder="B 9123 XX"></div>
<div><label for="unit">Kode unit trailer</label><input id="unit" placeholder="TR-001"></div>
<div><label for="km">Odometer (km)</label><input type="number" id="km" min="0"></div>
<div><label for="jenis">Jenis perbaikan</label>
<select id="jenis"><option>Servis berkala</option><option>Rem</option><option>Ban</option><option>Axle / as roda</option><option>Kelistrikan / lampu</option><option>Landing gear</option><option>King pin / fifth wheel</option><option>Suspensi</option><option>Bodi / sasis</option><option>Lainnya</option></select></div>
<div><label for="biaya">Biaya (Rp)</label><input type="number" id="biaya" min="0"></div>
<div><label for="bengkel">Bengkel / mekanik</label><input id="bengkel"></div>
<div><label for="status">Status</label><select id="status"><option>Selesai</option><option>Dalam proses</option><option>Menunggu suku cadang</option></select></div>
</div>
<div style="margin-top:12px"><label for="ket">Keterangan / suku cadang yang diganti</label><textarea id="ket" rows="3"></textarea></div>
<div class="row"><button id="simpan">Simpan catatan</button><button class="alt" id="batal" hidden>Batal edit</button></div>
</section>

<section class="card">
<h2>Daftar riwayat</h2>
<div class="tools">
<input id="cari" placeholder="Cari nomor polisi, unit, atau jenis perbaikan" aria-label="Cari">
<button class="alt" id="csv">Unduh Excel (CSV)</button>
<button class="alt" id="cadangan">Simpan cadangan</button>
<button class="alt" id="pulih">Buka cadangan</button>
<input type="file" id="berkas" accept=".json" hidden>
</div>
<div class="wrap" id="tabel"></div>
<div class="total" id="total"></div>
</section>
</main>
<script>
var KEY="sarijasa_perbaikan_v1";
var data=[],editId=null;
function muat(){try{data=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){data=[]}}
function simpanLS(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert("Data gagal disimpan di browser ini.")}}
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function rp(n){return "Rp "+Number(n||0).toLocaleString("id-ID")}
var F=["tgl","plat","unit","km","jenis","biaya","bengkel","status","ket"];
function kosong(){F.forEach(function(f){var e=$(f);if(e.tagName==="SELECT")e.selectedIndex=0;else e.value=""});$("tgl").value=new Date().toISOString().slice(0,10);editId=null;$("batal").hidden=true;$("judulForm").textContent="Catat perbaikan baru"}
$("simpan").onclick=function(){
 var r={};F.forEach(function(f){r[f]=$(f).value.trim()});
 if(!r.plat||!r.tgl){alert("Tanggal dan nomor polisi wajib diisi.");return}
 r.plat=r.plat.toUpperCase();
 if(editId){data=data.map(function(d){return d.id===editId?Object.assign({id:editId},r):d})}
 else{r.id=Date.now();data.push(r)}
 simpanLS();kosong();tampil();
};
$("batal").onclick=kosong;
function ubah(id){var d=data.find(function(x){return x.id===id});if(!d)return;F.forEach(function(f){$(f).value=d[f]||""});editId=id;$("batal").hidden=false;$("judulForm").textContent="Ubah catatan";window.scrollTo({top:0,behavior:"smooth"})}
function hapus(id){if(confirm("Hapus catatan ini?")){data=data.filter(function(d){return d.id!==id});simpanLS();tampil()}}
function tampil(){
 var q=$("cari").value.toLowerCase();
 var list=data.filter(function(d){return (d.plat+" "+d.unit+" "+d.jenis+" "+d.bengkel).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.tgl.localeCompare(a.tgl)});
 if(!list.length){$("tabel").innerHTML='<div class="empty">Belum ada catatan. Isi formulir di atas lalu klik Simpan catatan.</div>';$("total").textContent="";return}
 var h="<table><thead><tr><th>Tanggal</th><th>Nopol / Unit</th><th>Perbaikan</th><th>Km</th><th>Biaya</th><th>Status</th><th></th></tr></thead><tbody>";
 var t=0;
 list.forEach(function(d){t+=Number(d.biaya||0);
 h+="<tr><td>"+esc(d.tgl)+"</td><td>"+esc(d.plat)+"<br>"+esc(d.unit)+"</td><td><b>"+esc(d.jenis)+"</b><br>"+esc(d.ket)+"<br><small>"+esc(d.bengkel)+"</small></td><td>"+esc(d.km)+"</td><td>"+rp(d.biaya)+"</td><td>"+esc(d.status)+"</td><td><button class='alt' onclick='ubah("+d.id+")'>Ubah</button> <button class='del' onclick='hapus("+d.id+")'>Hapus</button></td></tr>"});
 $("tabel").innerHTML=h+"</tbody></table>";
 $("total").textContent=list.length+" catatan, total biaya "+rp(t);
}
$("cari").oninput=tampil;
function unduh(nama,isi,tipe){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([isi],{type:tipe}));a.download=nama;a.click()}
$("csv").onclick=function(){
 var k=["tgl","plat","unit","km","jenis","biaya","bengkel","status","ket"];
 var s="\ufeff"+k.join(";")+"\n"+data.map(function(d){return k.map(function(f){return '"'+String(d[f]||"").replace(/"/g,'""')+'"'}).join(";")}).join("\n");
 unduh("riwayat-perbaikan-trailer.csv",s,"text/csv");
};
$("cadangan").onclick=function(){unduh("cadangan-perbaikan-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(data),"application/json")};
$("pulih").onclick=function(){$("berkas").click()};
$("berkas").onchange=function(e){
 var f=e.target.files[0];if(!f)return;var r=new FileReader();
 r.onload=function(){try{var x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;if(confirm("Data saat ini akan diganti dengan isi cadangan. Lanjutkan?")){data=x;simpanLS();tampil()}}catch(err){alert("Berkas cadangan tidak valid.")}};
 r.readAsText(f);e.target.value="";
};
muat();kosong();tampil();
</script>
</body>
</html>
